apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: fleet-ai
spec:
  replicas: 1
  # NOTE: single-broker for the scaffold. For real production HA, move to the
  # Strimzi Kafka Operator (KRaft mode, multi-broker, proper StatefulSet + PVCs)
  # rather than scaling this Deployment naively — Kafka brokers are not
  # interchangeable replicas of each other.
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper.fleet-ai.svc.cluster.local:2181" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.fleet-ai.svc.cluster.local:9092" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
