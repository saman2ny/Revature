apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: fleet-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: monitoring-service }
  template:
    metadata:
      labels: { app: monitoring-service }
    spec:
      containers:
        - name: monitoring-service
          image: ghcr.io/your-org/fleet-ai/monitoring-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: fleetai-common-config }
          env:
            - { name: SERVER_PORT, value: "8081" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: fleetai-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
