apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetai-ingress
  namespace: fleet-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support for the STOMP endpoint proxied through api-gateway
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
spec:
  ingressClassName: nginx
  rules:
    - host: fleet-ai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
    - host: dashboard.fleet-ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: supervisor-dashboard, port: { number: 80 } }
    - host: driver.fleet-ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: driver-mobile-app, port: { number: 80 } }
