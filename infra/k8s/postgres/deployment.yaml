apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fleet-ai
spec:
  replicas: 1
  strategy: { type: Recreate }  # stateful single-instance; use a managed DB or an operator (Zalando/CloudNativePG) for HA
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: fleetai
            - name: POSTGRES_USER
              value: fleetai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fleetai-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fleetai"] }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
