apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetai-common-config
  namespace: fleet-ai
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.fleet-ai.svc.cluster.local:9092"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.fleet-ai.svc.cluster.local:5432/fleetai"
  SPRING_DATASOURCE_USERNAME: "fleetai"
  SPRING_REDIS_HOST: "redis.fleet-ai.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  AI_AGENT_SERVICE_URL: "http://ai-agent-service.fleet-ai.svc.cluster.local:8083"
  MONITORING_SERVICE_URL: "http://monitoring-service.fleet-ai.svc.cluster.local:8081"
  ROUTE_SERVICE_URL: "http://route-optimization-service.fleet-ai.svc.cluster.local:8082"
  NOTIFICATION_SERVICE_URL: "http://notification-alert-service.fleet-ai.svc.cluster.local:8084"
  LLM_MODEL: "claude-sonnet-5"
