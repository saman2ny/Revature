apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
  namespace: fleet-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-agent-service }
  template:
    metadata:
      labels: { app: ai-agent-service }
    spec:
      containers:
        - name: ai-agent-service
          image: ghcr.io/your-org/fleet-ai/ai-agent-service:latest
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: fleetai-common-config }
          env:
            - { name: SERVER_PORT, value: "8083" }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: fleetai-secrets, key: POSTGRES_PASSWORD } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: fleetai-secrets, key: ANTHROPIC_API_KEY } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            # LLM calls are the bottleneck here, not CPU — sized for concurrent
            # in-flight requests rather than compute-heavy work.
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
