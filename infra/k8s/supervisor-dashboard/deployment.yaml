apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor-dashboard
  namespace: fleet-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: supervisor-dashboard }
  template:
    metadata:
      labels: { app: supervisor-dashboard }
    spec:
      containers:
        - name: supervisor-dashboard
          image: ghcr.io/your-org/fleet-ai/supervisor-dashboard:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
