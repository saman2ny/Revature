version: "3.9"

# Fleet AI Platform — local development stack
# Run: docker compose up -d --build
# Observability (Prometheus/Grafana) is opt-in: docker compose --profile observability up -d

x-spring-common: &spring-common
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleetai
  SPRING_DATASOURCE_USERNAME: fleetai
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleetai_dev_pw}
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379

networks:
  fleetai-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  kafka-data:

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [fleetai-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [fleetai-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-kafka-topics.sh"]
    volumes:
      - ./scripts:/scripts
    networks: [fleetai-net]

  postgres:
    # pgvector/pgvector image = Postgres + the pgvector extension pre-installed,
    # used both for relational data and as the RAG vector store.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fleetai
      POSTGRES_USER: fleetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetai_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks: [fleetai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks: [fleetai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleetai_dev_pw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [fleetai-net]

  # ---------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------
  ai-agent-service:
    build: ./services/ai-agent-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8083
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [fleetai-net]

  monitoring-service:
    build: ./services/monitoring-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8081
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8083
    ports:
      - "8081:8081"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      ai-agent-service: { condition: service_started }
    networks: [fleetai-net]

  route-optimization-service:
    build: ./services/route-optimization-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8082
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8083
    ports:
      - "8082:8082"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      ai-agent-service: { condition: service_started }
    networks: [fleetai-net]

  notification-alert-service:
    build: ./services/notification-alert-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8084
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8083
    ports:
      - "8084:8084"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      ai-agent-service: { condition: service_started }
    networks: [fleetai-net]

  api-gateway:
    build: ./services/api-gateway
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      MONITORING_SERVICE_URL: http://monitoring-service:8081
      ROUTE_SERVICE_URL: http://route-optimization-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-alert-service:8084
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8083
    ports:
      - "8080:8080"
    depends_on:
      kafka: { condition: service_healthy }
      monitoring-service: { condition: service_started }
      route-optimization-service: { condition: service_started }
      notification-alert-service: { condition: service_started }
    networks: [fleetai-net]

  # ---------------------------------------------------------------------
  # Frontends
  # ---------------------------------------------------------------------
  supervisor-dashboard:
    build: ./frontend/supervisor-dashboard
    ports:
      - "8090:80"
    depends_on: [api-gateway]
    networks: [fleetai-net]

  driver-mobile-app:
    build: ./frontend/driver-mobile-app
    ports:
      - "8091:80"
    depends_on: [api-gateway]
    networks: [fleetai-net]

  # ---------------------------------------------------------------------
  # Observability (optional profile)
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [fleetai-net]

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"
    networks: [fleetai-net]
