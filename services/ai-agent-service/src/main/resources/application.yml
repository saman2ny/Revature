server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ai-agent-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetai}
    username: ${SPRING_DATASOURCE_USERNAME:fleetai}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetai_dev_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:claude-sonnet-5}
          temperature: 0.2
    vectorstore:
      pgvector:
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    # If an embeddings provider (OpenAI/Ollama/etc.) is added per the note in
    # config/VectorStoreConfig.java, disable its chat autoconfiguration here so it
    # doesn't compete with the Anthropic ChatModel bean, e.g.:
    # openai:
    #   api-key: ${OPENAI_API_KEY:}
    #   chat:
    #     enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fleetai: INFO
    org.springframework.ai: INFO
