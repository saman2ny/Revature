server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ai-agent-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetai}
    username: ${SPRING_DATASOURCE_USERNAME:fleetai}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetai_dev_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:claude-sonnet-5}
          temperature: 0.2
    vectorstore:
      pgvector:
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
    # Embeddings-only: self-hosted Ollama supplies the EmbeddingModel bean for pgvector;
    # chat is disabled here so Anthropic remains the sole ChatModel bean (no competing
    # autoconfig). base-url points at the Ollama service's private Railway domain.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false
      embedding:
        options:
          model: all-minilm

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fleetai: INFO
    org.springframework.ai: INFO
