server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: monitoring-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetai}
    username: ${SPRING_DATASOURCE_USERNAME:fleetai}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetai_dev_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

fleetai:
  ai-agent-service:
    url: ${AI_AGENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fleetai: INFO
